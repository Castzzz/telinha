<!doctype html>
<html lang="pt-BR" data-theme="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmissão — Teletela</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./stream-window.css">
</head>
<body>
  <header id="player-titlebar">
    <img src="./icon.png" width="20" height="20" alt="">
    <span class="player-brand">Teletela</span>
    <span class="titlebar-divider" aria-hidden="true"></span>
    <span id="window-stream-name">Transmissão</span>
  </header>
  <main id="stream-player" aria-label="Transmissão em janela">
    <video autoplay muted playsinline aria-label="Vídeo da transmissão"></video>
    <div id="player-controls">
      <div class="player-stream-info">
        <span class="player-stream-icon" aria-hidden="true">
          <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg>
        </span>
        <div class="player-stream-text">
          <span class="player-status"><span class="live-dot" aria-hidden="true"></span>AO VIVO</span>
          <span id="stream-name">Transmissão</span>
        </div>
      </div>
      <div class="player-actions">
        <button id="return-to-room" type="button" title="Voltar à sala" aria-label="Voltar à sala">
          <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m10 7-5 5 5 5m-5-5h13"/><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg>
          <span>Voltar à sala</span>
        </button>
        <span class="player-action-divider" aria-hidden="true"></span>
        <button id="fullscreen" type="button" title="Tela cheia (F ou F11)" aria-label="Entrar em tela cheia">
          <svg class="icon-svg fullscreen-enter" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
          <svg class="icon-svg fullscreen-exit" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5"/></svg>
          <span>Tela cheia</span>
        </button>
      </div>
      <span id="player-error" role="status"></span>
    </div>
  </main>
  <script src="./stream-window-player.js"></script>
</body>
</html>
